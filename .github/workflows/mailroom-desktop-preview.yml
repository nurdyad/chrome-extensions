name: Desktop companion preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'MailroomNavigator/desktop/**'
      - 'MailroomNavigator/desktop-*.js'
      - 'MailroomNavigator/desktop-*.mjs'
      - '.github/workflows/mailroom-desktop-preview.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            args: '--mac --arm64 --x64 -c.mac.identity=null'
          - os: windows-latest
            platform: windows
            args: '--win --x64'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: MailroomNavigator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MailroomNavigator/desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop test
      - name: Native renderer smoke (isolated context)
        run: npm --prefix desktop run test:native
      - name: Build unsigned preview only
        run: npm --prefix desktop exec -- electron-builder ${{ matrix.args }} --projectDir desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-unsigned-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            MailroomNavigator/desktop/dist/*.dmg
            MailroomNavigator/desktop/dist/*.zip
            MailroomNavigator/desktop/dist/*.exe
